<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="Header">
        <div class="Header-logo">
            <img src="ASSETS/RPlogo.png" alt="Logo Rocio Pereira RP">
        </div>
        <ul class="Header-menu">
            <li class="Header-links">About me</li>
            <li class="Header-links">Projects</li>
            <li class="Header-links">Contact</li>
        </ul>
    </header>
    <main>
        <section class="Hero">
            <div class="Hero-wrapper">
                <div class="Hero-Rocio">
                 <img src="" alt="Caricatura Rocio" class="Hero-img">
                 <h2 class="Hero-h2">Rocío<br>Pereira</h2>
                </div>
                <div class="Hero-description">
                    <span>Frontend developer</span>
                    <span>UX/UI designer</span>
                    <span>Experimental AI & Creative tech</span>
                </div>

            </div>
        </section>
        <section class="Projects"></section>
            <h2 class="Projects-title">Projects.</h2>
            <div class="Projects-wrapper">
                <article class="Projects-columns">
                    <img src="ASSETS/PIXAR.png" alt="foto preview web Pixar" class="Projects-img">
                    <h3 class="Projects-h3">Pixar</h2>
                </article>
                <article class="Projects-columns">
                    <img src="ASSETS/STCK.png" alt="foto preview web Stockholm14" class="Projects-img">
                    <h3 class="Projects-h3">Stockholm14</h2>
                </article>
            </div>
    </main>
    
</body>
</html>
